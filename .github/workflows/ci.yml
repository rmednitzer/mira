name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install repository toolchain
        run: rustup install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features test-support --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --features test-support --locked
      - run: cargo build --release --locked
      - name: Verify lockfile identity after native checks
        run: git diff --exit-code -- Cargo.lock
      - name: Verify production target boundaries
        run: |
          test ! -e target/release/mira-process-fixture
          # The test-only ssh-keygen override must be compiled out of release builds.
          ! grep -q MIRA_TEST_SSH_KEYGEN target/release/mira
          ! grep -qE "MIRA_TEST_(JOURNALCTL|JOURNAL_DIRS|PROC_ROOT|RANDOM_SOURCE)" target/release/mira
          cargo run --locked -- demo
      - name: Validate versioned evidence JSON contract
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-schema.txt
          .schema-venv/bin/python -m pip check
          .schema-venv/bin/python scripts/test_schema_lock.py
          cargo build --locked
          .schema-venv/bin/python scripts/test_live_procfs.py
          .schema-venv/bin/python scripts/validate_evidence_schema.py --live-systemd --live-procfs
          .schema-venv/bin/python scripts/test_compare_evidence.py
          .schema-venv/bin/python scripts/validate_investigation_schema.py --live-systemd
          .schema-venv/bin/python scripts/validate_capture_schema.py
          .schema-venv/bin/python scripts/validate_memory_investigation.py
          .schema-venv/bin/python scripts/validate_pressure_investigation.py
          .schema-venv/bin/python scripts/validate_package_investigation.py
          .schema-venv/bin/python scripts/validate_host_investigations.py
          .schema-venv/bin/python scripts/validate_journal_investigation.py
          .schema-venv/bin/python scripts/validate_session.py
          .schema-venv/bin/python -W error::ResourceWarning agent/test_agent_harness.py
          .schema-venv/bin/python scripts/test_validation_contract.py
          .schema-venv/bin/python scripts/test_qualify_host.py
      - name: Qualify the runner with the checkout build
        run: |
          mkdir -p dist
          .schema-venv/bin/python scripts/qualify_host.py --host-class ci-runner --receipt dist/qualification-checkout.json
      - name: Install native packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev lintian
      - name: Build and inspect CLI Debian package
        run: |
          bash packaging/build-deb.sh
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = mira
          test "$(dpkg-deb -f "$deb" Architecture)" = "$(dpkg --print-architecture)"
          test "$(dpkg-deb -f "$deb" Suggests)" = "systemd, default-dbus-system-bus | dbus-system-bus, openssh-client"
          test -z "$(dpkg-deb -f "$deb" Recommends)"
          mkdir -p package-extract
          dpkg-deb -x "$deb" package-extract
          test "$(stat -c '%a' package-extract)" = 755
          test -x package-extract/usr/bin/mira
          test ! -e package-extract/usr/bin/mira-process-fixture
          test "$(stat -c '%a' package-extract/usr/share/doc/mira/copyright)" = 644
          test -f package-extract/usr/share/mira/schemas/evidence-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/investigation-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/investigation-v2.schema.json
          test -f package-extract/usr/share/mira/schemas/evidence-v2.schema.json
          test -f package-extract/usr/share/mira/schemas/capture-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/capture-v2.schema.json
          test -f package-extract/usr/share/mira/schemas/capture-v3.schema.json
          test -f package-extract/usr/share/mira/schemas/challenge-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/memory-headroom-v1.schema.json
          test -f package-extract/usr/share/doc/mira/memory-investigation.md
          test -f package-extract/usr/share/mira/schemas/pressure-ceiling-v1.schema.json
          test -f package-extract/usr/share/doc/mira/pressure-investigation.md
          test -f package-extract/usr/share/mira/schemas/package-installed-v1.schema.json
          test -f package-extract/usr/share/doc/mira/package-investigation.md
          test -f package-extract/usr/share/mira/schemas/uptime-minimum-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/kernel-release-v1.schema.json
          test -f package-extract/usr/share/doc/mira/host-investigations.md
          test -f package-extract/usr/share/doc/mira/signatures.md
          test -f package-extract/usr/share/mira/schemas/journal-events-v1.schema.json
          test -f package-extract/usr/share/doc/mira/journal-investigation.md
          test -f package-extract/usr/share/mira/schemas/session-v1.schema.json
          test -f package-extract/usr/share/mira/schemas/session-request-v1.schema.json
          test -f package-extract/usr/share/doc/mira/sessions.md
          test -f package-extract/usr/share/doc/mira/captures.md
          test -f package-extract/usr/share/doc/mira/investigations.md
          if dpkg-deb --contents "$deb" | grep -E '/(systemd/system|systemd/user)/'; then
            echo "unexpected systemd unit in CLI package" >&2
            exit 1
          fi
          if dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep -E '(^|/)(postinst|preinst|prerm|postrm)$'; then
            echo "unexpected maintainer script in CLI package" >&2
            exit 1
          fi
          (cd dist && sha256sum -c *.sha256)
          package-extract/usr/bin/mira demo
      - name: Qualify the runner with the extracted package binary
        run: |
          .schema-venv/bin/python scripts/qualify_host.py --host-class ci-runner --binary package-extract/usr/bin/mira --receipt dist/qualification-package.json
      - name: Test isolated Debian package lifecycle
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          bash packaging/test-deb-lifecycle.sh "$deb"
      - name: Lint Debian package
        run: |
          lintian --no-tag-display-limit dist/*.deb
      - name: Verify repeatable archive assembly
        run: |
          repeat_dir="$(mktemp -d)"
          trap 'rm -rf "$repeat_dir"' EXIT
          (umask 077; bash packaging/build-deb.sh "$repeat_dir")
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          cmp "$deb" "$repeat_dir/$(basename "$deb")"
      - name: Validate real dependency resolution and installed artifact
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          bash packaging/test-clean-install.sh "$deb" dist/clean-install-receipt.json
      - name: Compare independent source and target builds
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          bash packaging/test-rebuild.sh "$deb" dist/rebuild-receipt.json
      - name: Retain tested candidate package and validation receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-${{ matrix.runner }}
          path: |
            dist/clean-install-receipt.json
            dist/rebuild-receipt.json
            dist/qualification-checkout.json
            dist/qualification-package.json
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 30
