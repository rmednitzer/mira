name: Rust CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.1 fmt --all -- --check
      - run: cargo +1.93.1 clippy --all-targets -- -D warnings
      - run: cargo +1.93.1 test --all-targets --locked
      - run: cargo +1.93.1 build --release --locked
