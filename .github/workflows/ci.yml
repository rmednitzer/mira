name: Rust CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --all-targets -- -D warnings
      - run: cargo +1.99.1 test --all-targets --locked
      - run: cargo +1.99.1 build --release --locked
