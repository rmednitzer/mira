name: One-time service formatter
on:
  push:
    branches: [feat/systemd-service-evidence]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/systemd-service-evidence
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - name: Format Rust changes
        run: |
          cargo +1.93.1 fmt --all
          git add src
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format service collector'
            git push origin HEAD:feat/systemd-service-evidence
          fi
