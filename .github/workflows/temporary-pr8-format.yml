name: Temporary format PR8
on:
  push:
    branches: [feat/linux-identity-pressure]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linux-identity-pressure
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - name: Commit formatted files
        run: |
          cargo +1.93.1 fmt --all
          git add src
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format extended Linux observations'
            git push origin HEAD:feat/linux-identity-pressure
          fi
